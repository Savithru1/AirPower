<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AirPower report{% endblock %}</title>
<style>
  :root { --ink: #1d2430; --muted: #5b6573; --rule: #d5dae1; --head: #f3f5f8; --accent: #1f3b5c;
          --ok: #1e7b45; --ok-bg: #e5f4ea; --watch: #8a6a00; --watch-bg: #fdf3d2; --alert: #a61b1b; --alert-bg: #fbe0e0; }
  * { box-sizing: border-box; }
  html { background: #eceff3; }
  body { margin: 0 auto; max-width: 210mm; background: #fff; color: var(--ink);
         font: 10pt/1.45 "Segoe UI", "Helvetica Neue", Arial, sans-serif; padding: 16mm 15mm 14mm; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
           border-bottom: 2px solid var(--accent); padding-bottom: 8px; margin-bottom: 14px; }
  header h1 { font-size: 16pt; margin: 0; color: var(--accent); }
  header .sub { color: var(--muted); font-size: 9pt; margin-top: 2px; }
  header .doc { text-align: right; font-size: 8.5pt; color: var(--muted); line-height: 1.5; }
  h2 { font-size: 11.5pt; color: var(--accent); margin: 18px 0 6px; padding-bottom: 3px; border-bottom: 1px solid var(--rule); break-after: avoid; }
  p { margin: 4px 0; }
  .muted { color: var(--muted); }
  .small { font-size: 8.5pt; }
  table { width: 100%; border-collapse: collapse; margin: 4px 0 6px; font-size: 9pt; }
  th, td { border: 1px solid var(--rule); padding: 3px 6px; text-align: left; vertical-align: top; }
  th { background: var(--head); font-weight: 600; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr { break-inside: avoid; }
  table.kv { table-layout: fixed; }
  table.kv td { padding: 5px 8px; }
  .kv b { display: block; font-size: 8pt; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; }
  .kv span { font-size: 12pt; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 8.5pt; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
  .l0 { color: var(--ok); background: var(--ok-bg); } .l1 { color: var(--watch); background: var(--watch-bg); } .l2 { color: var(--alert); background: var(--alert-bg); }
  .p1 { color: var(--alert); } .p2 { color: var(--watch); } .p3 { color: var(--muted); }
  footer { margin-top: 18px; padding-top: 6px; border-top: 1px solid var(--rule); font-size: 8pt; color: var(--muted); }
  .print { position: fixed; top: 34px; right: 12px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .class { background: #1f3b5c; color: #fff; text-align: center; font-size: 8.5pt; font-weight: 700; letter-spacing: .6px; padding: 3px 0; margin: -16mm -15mm 12mm; }
  .class.foot { margin: 14px -15mm -14mm; }
  @page { size: A4; margin: 12mm; }
  @media print { html { background: #fff; } body { max-width: none; padding: 0; } .print { display: none; } .class { margin: -12mm -12mm 8mm; } .class.foot { margin: 10px -12mm -12mm; } }
  @media (max-width: 640px) { body { padding: 12px 16px; } table { display: block; overflow-x: auto; } }
</style>
</head>
<body>
<div class="class">{{ classification }}</div>
<button class="print" id="print">Print / save as PDF</button>
{% block body %}{% endblock %}
<footer>AirPower &middot; SIH 2026 PS 26249 &middot; prepared by {{ prepared_by }} on {{ generated | local }} from the integrated store ({{ run }}). Model outputs are decision support; the engineering authority decides.</footer>
<div class="class foot">{{ classification }}</div>
<script nonce="{{ nonce }}">document.getElementById("print").addEventListener("click", function () { window.print(); });</script>
</body>
</html>
