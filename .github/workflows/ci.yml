# AirPower - continuous integration.
#
#   test : unit tests (dataset tests skip themselves: the real data is not in the repository)
#   sim  : one short FleetSim run end to end (simulate -> integrate -> reconcile)
#   web  : type-check and build the dashboard
#   audit: known vulnerabilities in the Python and npm dependencies
#   docker: build the container image and check the compose file (the image was not built where it was written)
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --no-deps --ignore-requires-python progpy==1.7.1
          pip install --no-deps --no-build-isolation filterpy==1.4.5
      - name: Unit tests
        run: python -m pytest -q -m "not slow"

  sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Simulate, integrate, reconcile (90 days, no real-data signals)
        run: |
          python -m airpower.fleetsim run --days 90 --seed 1 --out outputs/fleetsim/ci --no-real-signals
          python -m airpower.ingest.load outputs/fleetsim/ci --db sqlite:///outputs/ci.sqlite
          python -m tools.reconcile outputs/fleetsim/ci --db sqlite:///outputs/ci.sqlite

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: npm dependencies (shipped in the dashboard)
        run: npm audit --omit=dev
        working-directory: web

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Secrets for the compose file (random, CI only)
        run: |
          mkdir -p deploy/secrets
          for f in airpower_secret airpower_admin_password airpower_db_password; do head -c 24 /dev/urandom | base64 > deploy/secrets/$f.txt; done
      - name: Compose file
        run: docker compose -f deploy/docker-compose.yml --profile tls --profile postgres config -q
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t airpower:ci .
      - name: Start it and wait for the health check
        run: |
          docker run -d --name ap -p 8000:8000 -e AIRPOWER_ADMIN_PASSWORD=ci-Passphrase-123456 airpower:ci
          for i in $(seq 1 40); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/readiness)" = 401
