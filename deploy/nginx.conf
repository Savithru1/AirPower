# TLS termination for AirPower (profile tls). Certificates: deploy/certs/server.crt and server.key,
# from the unit's PKI in a real deployment, or the self-signed pair made by `python -m tools.init_deploy --demo-cert`.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  server_tokens off;
  client_max_body_size 512k;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  limit_req_zone $binary_remote_addr zone=login:1m rate=30r/m;
  server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;      # replaces any value the client sent
    proxy_read_timeout 120s;
    location = /api/auth/login {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://app:8000;
    }
    location / {
      proxy_pass http://app:8000;
    }
  }
}
