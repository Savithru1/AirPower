# Type J - generic single-engine jet (fighter / advanced-trainer class).
# Illustrative parameters, not any in-service aircraft. Units:
#   weibull: [shape beta, scale eta] in the position's clock (fh = flight hours, cycles = landings)
#   pf:      P-F interval in clock units (how long before failure a defect is detectable at an
#            inspection); 0 = no warning (random electronic failures)
#   life:    hard-time limit(s) {fh, cycles, days}; replaced at the inspection before it is reached
#   level:   O (squadron line) or I (base) for the remove / install job
#   tat:     depot repair turnaround [min, max] days (rotables); lead: procurement [min, max] days
#   cost:    INR lakh per unit
#   nff:     share of removals that turn out no-fault-found
#   defer:   probability the defect can be deferred (aircraft stays serviceable with a limitation)
#   detect:  overrides the inspection's detection probability (visual wear items)
id: J
name: Generic single-engine jet
inspections:
  - {id: I50,   name: "50 h servicing",     interval_fh: 50,                       level: O, work_h: 12,  detect_p: 0.3}
  - {id: I150,  name: "150 h primary",      interval_fh: 150,  interval_days: 180, level: I, work_h: 80,  detect_p: 0.6}
  - {id: M1200, name: "Major servicing",    interval_fh: 1200, interval_days: 2190, level: D, work_h: 600, detect_p: 0.9}
snags: {rate_per_fh: 0.16, work_h: [0.5, 4.0], grounding_p: 0.55, recur_p: 0.12}
positions:
  - {pos: ENG,   name: Engine,                         ata: 72, qty: 1, pn: TF-4100-01, policy: CM, clock: fh,
     hums: {kind: cmapss, subset: FD001, hours_per_cycle: 5.0, pf_cycles: 60}, life: {fh: 1500},
     level: I, mttr_h: 24, tat: [60, 120], cost: 1200, nff: 0.0, defer: 0.0}
